name: OSS Dispatch Trigger

on:
  workflow_call:
    inputs:
      workflow_type:
        description: 'The workflow type to trigger'
        required: true
        type: string
      target_repository:
        description: 'The target repository to trigger the workflow in'
        required: true
        type: string
      artifact_name:
        description: 'The name of the artifact to pass to the workflow'
        required: false
        type: string
env:
  CLOUD_RUN_URL: https://github-oss-dispatcher-620062935108.europe-west1.run.app

jobs:
    trigger:
        runs-on: ubuntu-latest
        # permissions: id-token: allows the job to request an oidc token
        #
        # GitHub sets two env vars in it: ACTIONS_ID_TOKEN_REQUEST_URL and ACTIONS_ID_TOKEN_REQUEST_TOKEN.
        # The workflow still has to call that URL to get the signed JWT, and it can ask for a
        # specific audience with &audience=entur-oss-dispatcher.
        permissions:
            id-token: write
        steps:
        - name: Trigger downstream CI
          env:
            WORKFLOW_TYPE: ${{ inputs.workflow_type }}
            TARGET_REPOSITORY: ${{ inputs.target_repository }}
            ARTIFACT_NAME: ${{ inputs.artifact_name }}
            # PAYLOAD: ${{ github.event.inputs.payload }}
            AUDIENCE: entur-oss-dispatcher
          run: |
            OIDC_TOKEN="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r .value)"
            echo "::add-mask::${OIDC_TOKEN}"
            
            request_payload="$(jq -n \
            --arg workflow_type "$WORKFLOW_TYPE" \
            --arg target_repository "$TARGET_REPOSITORY" \
            --arg artifact_name "$ARTIFACT_NAME" \
            '{workflow_type: $workflow_type, target_repository: $target_repository}
            | if $artifact_name != "" then . + {artifact_name: $artifact_name} else . end')"
            
            curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "${CLOUD_RUN_URL}" -d "$request_payload"
