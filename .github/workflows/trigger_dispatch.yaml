name: OSS Dispatch Trigger

on:
  workflow_dispatch:
    inputs:
      wotkflow_type:
        description: 'The workflow type to trigger'
        required: true
      target_repository:
        description: 'The target repository to trigger the workflow in'
        required: true
      payload:
        description: 'The JSON payload to send'
        required: false

env:
  CLOUD_RUN_URL: https://github-oss-dispatcher-620062935108.europe-west1.run.app

jobs:
    trigger:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        outputs:
          response: ${{ steps.trigger.outputs.response }}
        steps:
        - name: Authenticate to Google Cloud
          id: auth
          uses: entur/gha-meta/.github/actions/cloud-auth@v1
          with:
            environment: dev
            gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
            gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

        - name: Trigger downstream CI
          id: trigger
          env:
            WORKFLOW_TYPE: ${{ github.event.inputs.wotkflow_type }}
            TARGET_REPOSITORY: ${{ github.event.inputs.target_repository }}
            PAYLOAD: ${{ github.event.inputs.payload }}
          run: |
            request_payload="$(jq -n \
              --arg event_type "trigger-downstream-ci" \
              --arg workflow_type "$WORKFLOW_TYPE" \
              --arg target_repository "$TARGET_REPOSITORY" \
              --arg payload "$PAYLOAD" \
              '{event_type: $event_type, client_payload: {workflow_type: $workflow_type, target_repository: $target_repository, payload: $payload}}')"
            id_token="$(gcloud auth print-identity-token --audiences="${CLOUD_RUN_URL}")"
            response="$(curl -sS -X POST -H "Authorization: Bearer ${id_token}" "${CLOUD_RUN_URL}" -d "$request_payload")"
            echo "response=${response}" >> "$GITHUB_OUTPUT"
        - name: Output response
          run: |
            echo "Response: ${{ steps.trigger.outputs.response }}"
