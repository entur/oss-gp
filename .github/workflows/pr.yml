name: PR
on:
  pull_request:

jobs:
  go-test:
    name: Go Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1
    with:
      dockerfile: Dockerfile
      ignore: DL3018

  docker-build:
    uses: ./.github/workflows/build.yml
    with:
      dockerfile: Dockerfile
      context: .

  docker-scan:
    needs: docker-build
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  trigger-downstream-ci:
    runs-on: ubuntu-latest
    needs: [ docker-build]
    env:
      ARTIFACT_NAME: ${{ needs.docker-build.outputs.image_artifact }}
      RUN_ID: ${{ github.run_id }}
      TARGET_REPOSITORY: entur/oss-gp-infra
      REPOSITORY: ${{ github.repository }}
      EVENT_TYPE: trigger-downstream-ci
      OSS_TEST_PAT: ${{ secrets.OSS_TEST_PAT }}
    steps:
      - name: Trigger downstream CI
        run: |
          # Strip any stray CR/LF from the token so a malformed secret can't corrupt the request headers.
          token="$(printf '%s' "$OSS_TEST_PAT" | tr -d '\r\n')"
          payload="$(jq -n \
            --arg event_type "$EVENT_TYPE" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg run_id "$RUN_ID" \
            --arg repository "$REPOSITORY" \
            '{event_type: $event_type, client_payload: {artifact_name: $artifact_name, run_id: $run_id, repository: $repository}}')"
          echo "Triggering downstream CI for $REPOSITORY with docker artifact $ARTIFACT_NAME"
          curl --fail-with-body -X POST \
          -H "Authorization: token $token" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Content-Type: application/json" "https://api.github.com/repos/$TARGET_REPOSITORY/dispatches" \
          -d "$payload"